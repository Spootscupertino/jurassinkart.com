<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Triceratops encyclopedia content preview</title>
  <style>html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#0d0b07}</style>
</head>
<body>
<iframe id="page" src="../organism_page.html" title="Triceratops encyclopedia preview"></iframe>
<script>
const frame=document.querySelector("#page");
const text=(root,selector,value)=>{const node=root.querySelector(selector);if(node)node.textContent=value};
const section=(doc,title)=>{const el=doc.createElement("section");const h=doc.createElement("h2");h.textContent=title;el.append(h);return el};
frame.addEventListener("load",async()=>{
  const data=await fetch("./CR02_triceratops_horridus_content.json").then(r=>r.json());
  const doc=frame.contentDocument;
  text(doc,".hero h1",data.scientificName);
  text(doc,".hero .eyebrow span:first-child","The Living Past · Vol V");
  text(doc,".hero .eyebrow .no","No. 02 · Above Ground");
  text(doc,".hero .sub",`Land Animal · ${data.diet} · Late Cretaceous, ${data.ageRange_Ma[0]}–${data.ageRange_Ma[1]} Ma`);
  text(doc,".hero .badge","● Well-documented reconstruction");
  const values=doc.querySelectorAll(".facts .fv");
  [data.size,`${data.ageRange_Ma[0]}–${data.ageRange_Ma[1]} Ma`,data.diet,data.habitat].forEach((v,i)=>values[i].textContent=v);
  text(doc,".blurb",data.blurb);
  text(doc,".main .body-copy",data.notes);
  const notes=doc.querySelector(".funfacts");notes.replaceChildren();
  data.funFacts.forEach(value=>{const li=doc.createElement("li");li.textContent=value;notes.append(li)});
  text(doc,".survivor p",data.survivor);
  text(doc,".distrib p",data.distribution);

  const evidence=section(doc,"What the fossils tell us");evidence.className="evidence";
  [["Direct evidence",data.fossilEvidence.directEvidence],["Supported inference",data.fossilEvidence.supportedInference],["Artistic reconstruction",data.fossilEvidence.artisticReconstruction]].forEach(([label,items])=>{
    const h=doc.createElement("h3");h.textContent=label;const ul=doc.createElement("ul");ul.className="funfacts";
    items.forEach(value=>{const li=doc.createElement("li");li.textContent=value;ul.append(li)});evidence.append(h,ul);
  });
  notes.closest(".main").append(evidence);

  const deep=section(doc,"Deeper dive");deep.className="deeper-dive";
  data.deeperDive.forEach(entry=>{
    const article=doc.createElement("article");article.className="deep-card";
    const kind=doc.createElement("div");kind.className="deep-kind";kind.textContent=entry.kind.replace("_"," ");
    const link=doc.createElement("a");link.href=entry.url;link.target="_blank";link.rel="noopener noreferrer";link.textContent=entry.title;
    const by=doc.createElement("div");by.className="deep-byline";by.textContent=`${entry.creator}${entry.year?` · ${entry.year}`:""}`;
    const p=doc.createElement("p");p.textContent=entry.description;article.append(kind,link,by,p);deep.append(article);
  });
  notes.closest(".main").append(deep);

  const refs=doc.querySelector(".refs");refs.replaceChildren();
  data.references.forEach((ref,i)=>{const a=doc.createElement("a");a.href=ref.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=`[${i+1}]`;a.title=`${ref.authors.join(", ")} (${ref.year??"n.d."}). ${ref.title}.`;refs.append(a,doc.createTextNode(" "))});

  const style=doc.createElement("style");style.textContent=`
    .main .body-copy{white-space:pre-line}.evidence,.deeper-dive{margin-top:36px}
    .evidence h3{margin:24px 0 6px;color:var(--ivory);font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
    .deep-card{border-top:1px solid var(--hair);padding:16px 0}.deep-card:first-of-type{border-top:0}
    .deep-kind{color:var(--brass);font-size:10px;letter-spacing:.18em;margin-bottom:5px;text-transform:uppercase}
    .deep-card a{color:var(--brass-hi);font-family:var(--body);font-size:20px;font-style:italic;text-decoration:none}
    .deep-byline{color:var(--muted);font-size:12px;margin-top:4px}.deep-card p{color:#e4dabf;font-size:14px;line-height:1.55}.refs a{display:inline-block;margin:0 5px 5px 0}
  `;doc.head.append(style);
});
</script>
</body>
</html>
